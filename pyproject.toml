[project]
name = "nestworth"
version = "2.0.0"
description = "House price valuation for five Indian metros, with a calibrated 90% interval."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sam Gabriel" }]
dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.49.0",
    "pandas==3.0.3",
    "numpy==2.5.0",
    "scikit-learn==1.9.0",
    "xgboost==3.3.0",
    "joblib==1.5.3",
]

[project.optional-dependencies]
train = ["matplotlib", "seaborn"]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
